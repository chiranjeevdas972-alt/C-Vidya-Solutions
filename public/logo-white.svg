<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <linearGradient id="chevron-white-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="inner-white-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="logo-drop-shadow-white" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dynamic Chevron Brand Mark -->
  <g transform="translate(8, 9) scale(0.172) translate(-312, -90)" filter="url(#logo-drop-shadow-white)">
    <path
      d="M 315,90 L 580,280 L 345,450 L 380,395 L 485,280 L 318,160 Z"
      fill="url(#chevron-white-grad)"
    />
    <path
      d="M 312,320 L 425,240 L 452,268 L 312,415 Z"
      fill="url(#inner-white-grad)"
    />
  </g>

  <!-- Typography -->
  <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5" fill="#FFFFFF">C VIDYA</text>
  <text x="66" y="63" font-family="-apple-system, BlinkMacSystemFont, "JetBrains Mono", monospace, sans-serif" font-weight="800" font-size="10.5" letter-spacing="4.5" fill="#60A5FA">SOLUTIONS</text>
</svg>