<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="C Vidya Solutions Logo (White)" title="C Vidya Solutions" desc="Double chevron logo with professional white typography for C Vidya Solutions on dark backgrounds">
  <defs>
    <!-- Vibrant Blue Metallic Gradient for the Chevron Icon (slightly adjusted for dark backgrounds) -->
    <linearGradient id="logo-grad-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#003B99" />
    </linearGradient>
    <!-- Drop Shadow for the Icon to give 3D depth -->
    <filter id="icon-shadow-white" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Group containing the Double Chevron Icon -->
  <g id="Icon" filter="url(#icon-shadow-white)">
    <!-- Shape 1: Top-Right Chevron Segment -->
    <path id="ChevronTopRight"
          d="M 398,116 L 686,336 L 593,397 L 512,335 L 532,311 L 398,212 Z"
          fill="url(#logo-grad-white)" />
    <!-- Shape 2: Bottom-Left Chevron Segment -->
    <path id="ChevronBottomLeft"
          d="M 398,410 L 480,356 L 561,418 L 398,525 Z"
          fill="url(#logo-grad-white)" />
  </g>
  <!-- Group containing Logo Text: "C VIDYA" (White) -->
  <text id="Text_CVidya" x="500" y="650" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">C VIDYA</text>
  <!-- Group containing Logo Sub-text: "— SOLUTIONS —" (White) -->
  <g id="Text_Solutions">
    <!-- Left Decorative Line -->
    <rect x="200" y="718" width="90" height="4" rx="2" fill="#FFFFFF" />
    <text x="500" y="728" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" letter-spacing="14" fill="#FFFFFF" text-anchor="middle">SOLUTIONS</text>
    <!-- Right Decorative Line -->
    <rect x="710" y="718" width="90" height="4" rx="2" fill="#FFFFFF" />
  </g>
</svg>