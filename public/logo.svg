<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="C Vidya Solutions Logo" title="C Vidya Solutions" desc="Double chevron logo with professional typography for C Vidya Solutions">
  <defs>
    <!-- Vibrant Blue Metallic Gradient for the Chevron Icon -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="40%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#001E62" />
    </linearGradient>
    <!-- Deep Navy Solid/Gradient for Typography -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001E62" />
      <stop offset="100%" stop-color="#052E7A" />
    </linearGradient>
    <!-- Drop Shadow for the Icon to give 3D depth -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001E62" flood-opacity="0.15"/>
    </filter>
    <!-- Pulse/Glow effect for animations -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Group containing the Double Chevron Icon -->
  <g id="Icon" filter="url(#icon-shadow)">
    <!-- Shape 1: Top-Right Chevron Segment -->
    <path id="ChevronTopRight"
          d="M 398,116 L 686,336 L 593,397 L 512,335 L 532,311 L 398,212 Z"
          fill="url(#logo-grad)" />
    <!-- Shape 2: Bottom-Left Chevron Segment -->
    <path id="ChevronBottomLeft"
          d="M 398,410 L 480,356 L 561,418 L 398,525 Z"
          fill="url(#logo-grad)" />
  </g>
  <!-- Group containing Logo Text: "C VIDYA" -->
  <text id="Text_CVidya" x="500" y="650" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" fill="url(#text-grad)" text-anchor="middle" letter-spacing="4">C VIDYA</text>
  <!-- Group containing Logo Sub-text: "— SOLUTIONS —" -->
  <g id="Text_Solutions">
    <!-- Left Decorative Line -->
    <rect x="200" y="718" width="90" height="4" rx="2" fill="#001E62" />
    <text x="500" y="728" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" letter-spacing="14" fill="#001E62" text-anchor="middle">SOLUTIONS</text>
    <!-- Right Decorative Line -->
    <rect x="710" y="718" width="90" height="4" rx="2" fill="#001E62" />
  </g>
</svg>