<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>C Vidya Fitness Zone</title>
    <base href="/software/fitness/">
    <script>
      // Clean path so React Router matches root properly whether accessed via /software/fitness/ or /software/fitness/index.html
      (function() {
        try {
          if (window.location.pathname.endsWith('index.html')) {
            var clean = window.location.pathname.replace(/\/index\.html$/, '') || '/';
            if (!clean.endsWith('/')) clean += '/';
            window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
          }
        } catch(e) {
          console.warn('URL clean warning:', e);
        }
      })();
    </script>
    <script>
      (function() {
        window.addEventListener('error', function(event) {
          console.error('Bootstrap error captured in Fitness Zone:', event.error || event.message);
        });
        window.addEventListener('unhandledrejection', function(event) {
          console.error('Unhandled promise rejection in Fitness Zone:', event.reason);
        });

        function notifyParent() {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: 'CV_ROUTE_CHANGED',
                pathname: window.location.pathname,
                search: window.location.search,
                href: window.location.href,
                canGoBack: window.history.length > 1
              }, '*');
            }
          } catch(e) {}
        }

        window.addEventListener('message', function(e) {
          if (!e.data) return;
          if (e.data.type === 'CV_GO_BACK') {
            if (window.location.pathname !== '/' && window.location.pathname !== '/home' && !window.location.pathname.endsWith('index.html') && window.location.pathname !== '/software/fitness/' && window.location.pathname !== '/software/fitness') {
              if (window.history.length > 1) {
                window.history.back();
              } else {
                window.location.href = './';
              }
            } else {
              window.parent.postMessage({ type: 'CV_EXIT_SOFTWARE' }, '*');
            }
          } else if (e.data.type === 'CV_GO_HOME') {
            window.location.href = './';
          } else if (e.data.type === 'CV_NAVIGATE') {
            var target = e.data.path || './';
            if (target === '/') {
              if (window.location.pathname !== '/' && !window.location.pathname.endsWith('index.html') && window.location.pathname !== '/software/fitness/' && window.location.pathname !== '/software/fitness') {
                window.location.href = './';
              } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
            } else if (target.startsWith('#')) {
              var el = document.querySelector(target);
              if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
              } else {
                window.location.hash = target;
              }
            } else {
              var cleanTarget = target.replace(/^\//, '');
              window.location.href = cleanTarget;
            }
          }
        });

        // Native Fitness Zone navbar is kept fully visible with all header features, pricing, and about links

        window.addEventListener('popstate', notifyParent);
        const origPush = history.pushState;
        history.pushState = function() {
          origPush.apply(this, arguments);
          notifyParent();
        };
        const origReplace = history.replaceState;
        history.replaceState = function() {
          origReplace.apply(this, arguments);
          notifyParent();
        };
        window.addEventListener('DOMContentLoaded', notifyParent);
        window.addEventListener('load', notifyParent);
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-cWgupvWs.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index--Lv4jjzA.css">
    <script>
      (function() {
        function handleGoBack() {
          var p = window.location.pathname;
          var h = window.location.hash;
          if ((p !== '/' && p !== '/software/fitness/' && p !== '/software/fitness' && !p.endsWith('index.html')) || (h && h !== '#' && h !== '#/')) {
            if (window.history.length > 1) {
              window.history.back();
            } else {
              window.location.href = './';
            }
          } else {
            if (window.opener && !window.opener.closed) {
              window.opener.focus();
              window.close();
            } else if (document.referrer) {
              window.location.href = document.referrer;
            } else {
              window.location.href = '/#services';
            }
          }
        }

        function checkNav() {
          if (window.parent !== window) return;
          // Standalone: merge Back button directly into the single navbar
          var navContainer = document.querySelector('nav div.max-w-7xl');
          if (navContainer) {
            var h = document.getElementById('cv-back-header');
            var s = document.getElementById('cv-back-spacer');
            if (h) h.style.display = 'none';
            if (s) s.style.display = 'none';

            if (!document.getElementById('cv-injected-back-btn')) {
              var firstChild = navContainer.firstChild;
              var backBtn = document.createElement('button');
              backBtn.id = 'cv-injected-back-btn';
              backBtn.type = 'button';
              backBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Back';
              backBtn.style.cssText = 'display:inline-flex;align-items:center;padding:7px 14px;background:#2563eb;color:#ffffff;border:none;border-radius:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;margin-right:12px;box-shadow:0 2px 8px rgba(37,99,235,0.4);transition:all 0.2s;flex-shrink:0;';
              backBtn.onmouseover = function() { backBtn.style.background = '#1d4ed8'; };
              backBtn.onmouseout = function() { backBtn.style.background = '#2563eb'; };
              backBtn.onclick = handleGoBack;
              if (firstChild) {
                firstChild.insertBefore(backBtn, firstChild.firstChild);
              }
            }
          } else {
            // Sub-page with no standard nav: show floating back header
            var h = document.getElementById('cv-back-header');
            var s = document.getElementById('cv-back-spacer');
            if (h) h.style.display = 'flex';
            if (s) s.style.display = 'block';
          }
        }

        window.addEventListener('DOMContentLoaded', function() {
          checkNav();
          var btn = document.getElementById('cv-back-btn');
          var closeBtn = document.getElementById('cv-close-btn');
          if (btn) btn.addEventListener('click', handleGoBack);
          if (closeBtn) closeBtn.addEventListener('click', handleGoBack);
        });
        window.addEventListener('load', checkNav);
        setInterval(checkNav, 400);
      })();
    </script>
  </head>
  <body class="bg-black text-white font-sans antialiased">
    <!-- Persistent Back to Preview Page Button Bar (active when opened in standalone tab) -->
    <div id="cv-back-header" style="position: fixed; top: 0; left: 0; right: 0; height: 56px; background-color: #071739; border-bottom: 1px solid rgba(59, 130, 246, 0.4); display: none; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 9999999; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="cv-back-btn" type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: background 0.2s; box-shadow: 0 2px 8px rgba(37,99,235,0.4);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back</span>
        </button>
        <span style="font-weight: 700; font-size: 14px; color: #ffffff; letter-spacing: 0.5px;">C Vidya Fitness Zone</span>
      </div>
      <button id="cv-close-btn" type="button" style="padding: 8px 12px; background: rgba(255,255,255,0.1); border: none; color: #cbd5e1; cursor: pointer; font-size: 12px; font-weight: 600; border-radius: 8px;">Back to Preview</button>
    </div>
    <div id="cv-back-spacer" style="height: 56px; display: none;"></div>
    <div id="root"></div>
  </body>
</html>
