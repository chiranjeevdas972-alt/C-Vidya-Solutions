    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <base href="/software/petrol-pump/">
    <script>
      (function() {
        function isPetrolRoot() {
          var p = window.location.pathname.replace(/\/+$/, '');
          var h = window.location.hash;
          var hasInnerHash = h && h !== '#' && h !== '#/' && h !== '#home';
          var isRoot = (
            p === '' ||
            p === '/' ||
            p === '/home' ||
            p === '/software/petrol-pump' ||
            p.endsWith('/software/petrol-pump/index.html')
          );
          return isRoot && !hasInnerHash;
        }

        function getPetrolRootUrl() {
          return window.location.pathname.startsWith('/software/petrol-pump')
            ? '/software/petrol-pump/'
            : './';
        }

        function notifyParent() {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: 'CV_ROUTE_CHANGED',
                pathname: window.location.pathname,
                search: window.location.search,
                href: window.location.href,
                isRoot: isPetrolRoot(),
                canGoBack: !isPetrolRoot()
              }, '*');
            }
          } catch(e) {}
        }
        window.addEventListener('message', function(e) {
          if (!e.data) return;
          if (e.data.type === 'CV_GO_BACK') {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'CV_GO_TO_PREVIEW' }, '*');
            } else if (document.referrer) {
              window.location.href = document.referrer;
            } else {
              window.location.href = '/';
            }
          } else if (e.data.type === 'CV_GO_HOME') {
            window.location.href = getPetrolRootUrl();
          } else if (e.data.type === 'CV_NAVIGATE') {
            var target = e.data.path || getPetrolRootUrl();
            if (target === '/') {
              window.location.href = getPetrolRootUrl();
            } else {
              window.location.href = target;
            }
          }
        });
        window.addEventListener('popstate', notifyParent);
        const origPush = history.pushState;
        history.pushState = function() {
          origPush.apply(this, arguments);
          notifyParent();
        };
        const origReplace = history.replaceState;
        history.replaceState = function() {
          origReplace.apply(this, arguments);
          notifyParent();
        };
        window.addEventListener('load', notifyParent);

        // Global back interceptor: always return to step-by-step preview page
        document.addEventListener('click', function(e) {
          const btn = e.target.closest('button, a');
          if (!btn) return;
          const text = (btn.textContent || '').trim().toLowerCase();
          const aria = (btn.getAttribute('aria-label') || '').toLowerCase();
          const title = (btn.getAttribute('title') || '').toLowerCase();
          if (text === 'back' || aria === 'back' || title === 'back' || btn.id === 'cv-injected-back-btn' || btn.querySelector('svg.lucide-arrow-left')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'CV_GO_TO_PREVIEW' }, '*');
            } else if (document.referrer) {
              window.location.href = document.referrer;
            } else {
              window.location.href = '/';
            }
            return false;
          }
        }, true);
      })();
    </script>
