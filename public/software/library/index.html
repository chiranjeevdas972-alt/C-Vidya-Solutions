    <meta charset="UTF-8" />

    <script>
      // Clean path so React Router matches root properly whether accessed via /software/library/ or /software/library/index.html
      (function() {
        try {
          if (window.location.pathname.endsWith('index.html')) {
            var clean = window.location.pathname.replace(/\/index\.html$/, '') || '/';
            if (!clean.endsWith('/')) clean += '/';
            window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
          }
        } catch(e) {
          console.warn('URL clean warning:', e);
        }
      })();
    </script>
    <script>
      (function() {
        window.addEventListener('error', function(event) {
          console.error('Early bootstrap error captured:', event.error || event.message);
          showEarlyFallback(event.error || event.message);
        });
        window.addEventListener('unhandledrejection', function(event) {
          console.warn('Library unhandled promise rejection handled:', event.reason);
        });
        
        function showEarlyFallback(err) {
          var root = document.getElementById('root');
          if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
            var errorText = String(err && err.stack ? err.stack : err);
            root.innerHTML = `
              <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f8fafc; padding: 24px; font-family: system-ui, -apple-system, sans-serif;">
                <div style="max-width: 480px; width: 100%; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); padding: 32px; text-align: center; border: 1px solid #e2e8f0;">
                  <div style="width: 64px; height: 64px; background-color: #fee2e2; border-radius: 9999px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto;">
                    <svg style="width: 32px; height: 32px; color: #ef4444;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                  </div>
                  <h1 style="font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 8px;">System Bootstrap Recovery</h1>
                  <p style="font-size: 14px; color: #475569; margin-bottom: 24px; line-height: 1.5;">
                    The application encountered a fatal initialization error during startup. Let's recover the application automatically.
                  </p>
                  <div style="margin-bottom: 24px; text-align: left; background-color: #f1f5f9; border-radius: 8px; padding: 16px; border: 1px solid #e2e8f0; font-family: monospace; font-size: 11px; color: #b91c1c; overflow-x: auto; max-height: 150px; white-space: pre-wrap;">
                    ${errorText}
                  </div>
                  <button onclick="window.location.reload()" style="cursor: pointer; display: inline-block; width: 100%; background-color: #4f46e5; color: white; border: none; border-radius: 8px; padding: 12px 24px; font-weight: 600; font-size: 14px; transition: background-color 0.2s;">
                    Force Reload & Recover
                  </button>
                  <div style="margin-top: 16px; font-size: 11px; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 12px;">
                    Production Safe Guard Active • C Vidya
                  </div>
                </div>
              </div>
            `;
          }
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DqU-GHXn.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-qqRAAbNB.css">
  
    <script>
      (function() {
        function isLibraryRoot() {
          var p = window.location.pathname.replace(/\/+$/, '');
          var h = window.location.hash;
          var hasInnerHash = h && h !== '#' && h !== '#/' && h !== '#home';
          var isRoot = (
            p === '' ||
            p === '/' ||
            p === '/home' ||
            p === '/software/library' ||
            p.endsWith('/software/library/index.html') ||
            p === '/software/library/home'
          );
          return isRoot && !hasInnerHash;
        }

        function getLibraryRootUrl() {
          return window.location.pathname.startsWith('/software/library')
            ? '/software/library/'
            : './';
        }

        function notifyParent() {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: 'CV_ROUTE_CHANGED',
                pathname: window.location.pathname,
                search: window.location.search,
                href: window.location.href,
                isRoot: isLibraryRoot(),
                canGoBack: !isLibraryRoot()
              }, '*');
            }
          } catch(e) {}
        }

        window.addEventListener('message', function(e) {
          if (!e.data) return;
          if (e.data.type === 'CV_GO_BACK') {
            var p = (window.location.pathname || '').replace(/\/+$/, '') || '/';
            // 1. Feature subpages -> go back to dashboard
            var isSubpage = (
              p.indexOf('/students') !== -1 ||
              p.indexOf('/billing') !== -1 ||
              p.indexOf('/seats') !== -1 ||
              p.indexOf('/books') !== -1 ||
              p.indexOf('/book-issues') !== -1 ||
              p.indexOf('/reports') !== -1 ||
              p.indexOf('/transactions') !== -1 ||
              p.indexOf('/fines') !== -1 ||
              p.indexOf('/settings') !== -1 ||
              p.indexOf('/audit') !== -1 ||
              p.indexOf('/profile') !== -1 ||
              p.indexOf('/subscription') !== -1 ||
              p.indexOf('/advanced-analytics') !== -1 ||
              p.indexOf('/student-analytics') !== -1 ||
              p.indexOf('/upcoming-payments') !== -1 ||
              p.indexOf('/multi-branch') !== -1 ||
              p.indexOf('/branding') !== -1 ||
              p.indexOf('/api-access') !== -1 ||
              p.indexOf('/ai-assistant') !== -1 ||
              p.indexOf('/accounting') !== -1
            );
            if (isSubpage) {
              window.history.back();
              setTimeout(function() {
                if (window.location.pathname.indexOf('/dashboard') === -1) {
                  window.location.href = getLibraryRootUrl() + 'dashboard';
                }
              }, 200);
              return;
            }

            // 2. Dashboard -> go back to login
            if (p.endsWith('/dashboard') || p.indexOf('/dashboard') !== -1) {
              window.history.back();
              setTimeout(function() {
                var cur = (window.location.pathname || '').replace(/\/+$/, '') || '/';
                if (cur.indexOf('/dashboard') !== -1) {
                  window.location.href = getLibraryRootUrl() + 'login';
                }
              }, 150);
              return;
            }

            // 3. Login or register or otp -> go to C Vidya Library Management landing page
            if (p.endsWith('/login') || p.endsWith('/register') || p.endsWith('/verify-otp') || p.indexOf('/login') !== -1 || p.indexOf('/register') !== -1) {
              window.history.back();
              setTimeout(function() {
                var cur = (window.location.pathname || '').replace(/\/+$/, '') || '/';
                if (cur.indexOf('/login') !== -1 || cur.indexOf('/register') !== -1) {
                  window.location.href = getLibraryRootUrl();
                }
              }, 150);
              return;
            }

            // 4. Software Landing Page -> close portal and return to app
            window.parent.postMessage({ type: 'CV_CLOSE_PORTAL' }, '*');
          } else if (e.data.type === 'CV_GO_HOME') {
            window.location.href = getLibraryRootUrl();
          } else if (e.data.type === 'CV_NAVIGATE') {
            var target = e.data.path || getLibraryRootUrl();
            if (target === '/') {
              window.location.href = getLibraryRootUrl();
            } else {
              window.location.href = target;
            }
          }
        });
        window.addEventListener('popstate', notifyParent);
        const origPush = history.pushState;
        history.pushState = function() {
          origPush.apply(this, arguments);
          notifyParent();
        };
        const origReplace = history.replaceState;
        history.replaceState = function() {
          origReplace.apply(this, arguments);
          notifyParent();
        };
        window.addEventListener('DOMContentLoaded', notifyParent);
        window.addEventListener('load', notifyParent);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
